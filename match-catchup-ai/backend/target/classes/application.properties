spring.application.name=match-catchup-ai

server.port=8082

# ==========================================
# MySQL Database (Separate from match-score-generator)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3307/match_catchup_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=kishan03
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# Redis Cache (Latest Live Score Only - TTL 6h)
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000
matchcatchup.redis.live-score-ttl-seconds=21600

# ==========================================
# Eureka Client Configuration
# ==========================================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ==========================================
# Scheduled Collector & Activity Tracking
# ==========================================
matchcatchup.score-generator.url=http://localhost:8081
matchcatchup.collector.interval-ms=10000
matchcatchup.collector.match-id=IND-AUS-001
matchcatchup.collector.reset-on-startup=true
matchcatchup.activity.heartbeat-interval-ms=15000
matchcatchup.activity.inactivity-threshold-seconds=45

# ==========================================
# Ollama & PostgreSQL + pgvector
# ==========================================
ollama.base-url=http://localhost:11434
ollama.model=llama3.1:8b
postgres.vector.url=jdbc:postgresql://localhost:5432/match_catchup_vector
postgres.vector.username=postgres
postgres.vector.password=postgres
spring.ai.ollama.base-url=${ollama.base-url:http://localhost:11434}
spring.ai.ollama.chat.options.model=${ollama.model:llama3.1:8b}
spring.ai.ollama.embedding.model=${ollama.embedding-model:nomic-embed-text}
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW
matchcatchup.jwt.secret=${MATCHCATCHUP_JWT_SECRET:local-development-secret-change-this-to-a-long-random-value}
matchcatchup.jwt.expiration-seconds=86400
